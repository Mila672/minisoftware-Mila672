name: Build APK and EXE Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version for filenames and tag, for example v1
        required: true
        default: v1

permissions:
  contents: write

jobs:
  create_release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.vars.outputs.release_version }}
    steps:
      - name: Prepare release variables
        id: vars
        run: echo "release_version=${{ github.event.inputs.release_version }}" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.vars.outputs.release_version }}
        run: |
          gh release view "$RELEASE_VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "$RELEASE_VERSION" --repo "${{ github.repository }}" --title "$RELEASE_VERSION" --notes "Automatisch gebauter Release $RELEASE_VERSION"

  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: create_release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build debug APK
        run: npm run build:android

      - name: Rename APK
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "minisoftware-Mila672-${{ needs.create_release.outputs.release_version }}.apk"

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create_release.outputs.release_version }}" "minisoftware-Mila672-${{ needs.create_release.outputs.release_version }}.apk" --repo "${{ github.repository }}" --clobber

  build_windows:
    name: Build portable Windows EXE
    runs-on: windows-latest
    needs: create_release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npm run build:windows

      - name: Rename EXE
        shell: powershell
        run: |
          $releaseVersion = "${{ needs.create_release.outputs.release_version }}"
          $exe = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'Portable EXE was not created.' }
          Copy-Item -LiteralPath $exe.FullName -Destination "Mila672-$releaseVersion.exe" -Force

      - name: Upload EXE to release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create_release.outputs.release_version }}" "Mila672-${{ needs.create_release.outputs.release_version }}.exe" --repo "${{ github.repository }}" --clobber
